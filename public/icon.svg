<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A16" />
      <stop offset="100%" stop-color="#07070F" />
    </linearGradient>

    <!-- Brand Emblem Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="45%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Star Fill Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#8B5CF6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Border Stroke -->
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Glowing Emblem Badge -->
  <rect x="76" y="76" width="360" height="360" rx="88" fill="url(#brandGrad)" filter="url(#glow)" />

  <!-- Inner Badge Highlight -->
  <rect x="78" y="78" width="356" height="356" rx="86" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Center Primary Sparkle Star -->
  <path
    d="M256 140
       C256 195 285 224 340 224
       C285 224 256 253 256 308
       C256 253 227 224 172 224
       C227 224 256 195 256 140 Z"
    fill="url(#starGrad)"
  />

  <!-- Top-Right Cyan Sparkle (Truth Cyan) -->
  <path
    d="M346 168
       C346 188 356 198 376 198
       C356 198 346 208 346 228
       C346 208 336 198 316 198
       C336 198 346 188 346 168 Z"
    fill="#22D3EE"
  />

  <!-- Bottom-Left Coral Sparkle (Dare Coral) -->
  <path
    d="M176 296
       C176 314 185 323 203 323
       C185 323 176 332 176 350
       C176 332 167 323 149 323
       C167 323 176 314 176 296 Z"
    fill="#FB7185"
  />

  <!-- Small Ambient Starlight Points -->
  <circle cx="212" cy="184" r="5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="304" cy="276" r="6" fill="#C4B5FD" opacity="0.9" />
</svg>

