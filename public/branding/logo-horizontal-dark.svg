<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Truth Gradient -->
    <linearGradient id="hzTruthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Dare Gradient -->
    <linearGradient id="hzDareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Brand Violet Gradient -->
    <linearGradient id="hzVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Inner Core & Ribbons for the Embedded Icon -->
    <linearGradient id="hzIconTruth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="hzIconDare" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="hzSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8B5CF6" flood-opacity="0.35" />
    </filter>
  </defs>

  
      <rect width="800" height="200" rx="32" fill="#0A0A16" />
      <rect width="798" height="198" x="1" y="1" rx="31" fill="none" stroke="rgba(139, 92, 246, 0.25)" stroke-width="2" />
    

  <!-- Left: Scaled Emblem Mark (Centered in 160x160 area) -->
  <g transform="translate(30, 25) scale(0.29)" filter="url(#hzGlow)">
    <!-- Base Glow -->
    <circle cx="256" cy="245" r="140" fill="url(#hzIconTruth)" opacity="0.2" filter="blur(20px)" />
    <!-- Dare Blade -->
    <path
      d="M256 160 C256 160 292 205 284 252 C278 288 256 304 256 304 C256 304 234 288 228 252 C220 205 256 160 256 160 Z"
      fill="url(#hzIconDare)"
    />
    <path
      d="M256 182 C256 182 274 214 269 246 C266 268 256 278 256 278 C256 278 246 268 243 246 C238 214 256 182 256 182 Z"
      fill="#FFFFFF"
      opacity="0.8"
    />
    <!-- Truth Hook -->
    <path
      d="M212 304 C202 292 206 274 218 262 C236 244 266 226 288 206 C314 182 324 154 310 128 C294 98 254 90 220 102 C188 114 168 138 160 166 C157 176 147 182 136 179 C126 176 120 165 124 154 C136 114 166 78 212 64 C262 48 322 62 346 106 C368 146 352 190 316 224 C290 248 266 266 254 280 C248 288 246 296 244 306 C242 318 228 324 218 316 C215 313 213 309 212 304 Z"
      fill="url(#hzIconTruth)"
    />
    <!-- Diamond Dot -->
    <g transform="translate(256, 382)">
      <path
        d="M0 -34 C0 -10 10 0 34 0 C10 0 0 10 0 34 C0 10 -10 0 -34 0 C-10 0 0 -10 0 -34 Z"
        fill="url(#hzSparkGrad)"
      />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Right: Premium Typography Wordmark -->
  <g transform="translate(200, 105)">
    <!-- Main Headline: "PLAY TRUTH & DARE" -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" letter-spacing="-0.02em">
      <tspan fill="#FFFFFF" dx="0">PLAY</tspan>
      <tspan dx="16" fill="url(#hzTruthGrad)">TRUTH</tspan>
      <tspan dx="14" fill="#FB7185" font-weight="800">&amp;</tspan>
      <tspan dx="14" fill="url(#hzDareGrad)">DARE</tspan>
    </text>

    <!-- Subtitle: "TRUTH • DARE • LAUGH • REPEAT" -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" letter-spacing="0.25em">
      TRUTH <tspan fill="#FB7185">•</tspan> DARE <tspan fill="#FB7185">•</tspan> LAUGH <tspan fill="#FB7185">•</tspan> REPEAT
    </text>
  </g>
</svg>
